name: fu_market_deploy

# ==============================================================================
# DOCKER DÀNH CHO DEPLOYMENT / PRODUCTION (CÓ BUILD DOCKERFILE)
# ==============================================================================
# Đóng gói toàn bộ hệ thống: Backend (Dockerfile) + Redis + Meilisearch
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # BACKEND API SERVICE (Build từ Dockerfile Production)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fu_market_deploy_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - MEILISEARCH_HOST=http://meilisearch:7700
    volumes:
      - deploy_uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - deploy_network

  # ----------------------------------------------------------------------------
  # REDIS SERVICE (Cache & Distributed Lock)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fu_market_deploy_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-campusredispass123}
    ports:
      - "6379:6379"
    volumes:
      - deploy_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-campusredispass123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deploy_network

  # ----------------------------------------------------------------------------
  # MEILISEARCH SERVICE (Full-Text Search Engine)
  # ----------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: fu_market_deploy_meilisearch
    restart: always
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKeyFU2026Secure}
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7700:7700"
    volumes:
      - deploy_meili_data:/meili_data
    networks:
      - deploy_network

networks:
  deploy_network:
    driver: bridge

volumes:
  deploy_uploads_data:
    driver: local
  deploy_redis_data:
    driver: local
  deploy_meili_data:
    driver: local
