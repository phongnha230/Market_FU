name: fu_market

services:
  # ----------------------------------------------------
  # BACKEND API SERVICE (Node.js + Express + Prisma)
  # ----------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fu_market_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MEDIA_DOMAIN=${MEDIA_DOMAIN:-http://localhost:5000/uploads}
      - UPLOAD_DIR=uploads
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY:-}
      - R2_SECRET_KEY=${R2_SECRET_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-my-uploads}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SHIPPING_WEBHOOK_SECRET=${SHIPPING_WEBHOOK_SECRET}
      - HANDSHAKE_QR_SECRET=${HANDSHAKE_QR_SECRET}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-campusredispass123}
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY:-masterKeyFU2026Secure}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - campus_network

  # ----------------------------------------------------
  # REDIS SERVICE (Cache & Distributed Store)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fu_market_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-campusredispass123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-campusredispass123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus_network

  # ----------------------------------------------------
  # MEILISEARCH SERVICE (Full-Text & Instant Search)
  # ----------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: fu_market_meilisearch
    restart: always
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKeyFU2026Secure}
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - campus_network

networks:
  campus_network:
    driver: bridge

volumes:
  uploads_data:
    driver: local
  redis_data:
    driver: local
  meili_data:
    driver: local

