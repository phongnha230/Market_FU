# ==============================================================================
# NGINX DOCKER COMPOSE CONFIGURATION
# FU STUDENT SECOND-HAND MARKET BACKEND (DOCKER NETWORK)
# ==============================================================================

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 50M;

    # Cloudflare Real IP Restoration
    include /etc/nginx/conf.d/cloudflare.conf;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # Upstream Cluster: Load Balancer 2 Docker Containers (backend_1 và backend_2)
    upstream fu_market_backend_cluster {
        ip_hash; # Sticky sessions cho Socket.io
        server backend_1:5000 max_fails=3 fail_timeout=10s;
        server backend_2:5000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Static Uploads Volume
        location /uploads/ {
            alias /app/uploads/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header Access-Control-Allow-Origin *;
            access_log off;
            try_files $uri @proxy_to_backend;
        }

        location @proxy_to_backend {
            proxy_pass http://fu_market_backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Socket.io Endpoint
        location /socket.io/ {
            proxy_pass http://fu_market_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Auth Rate Limiting
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://fu_market_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        }

        # General API Endpoints
        location / {
            limit_req zone=api_general_limit burst=60 nodelay;
            proxy_pass http://fu_market_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            proxy_request_buffering off;
            proxy_connect_timeout 15s;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://fu_market_backend_cluster/api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
