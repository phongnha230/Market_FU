# ==============================================================================
# NGINX LOAD BALANCER & REVERSE PROXY CONFIGURATION
# FU STUDENT SECOND-HAND MARKET BACKEND
# ==============================================================================
# Hỗ trợ:
# 1. Load Balancer phân tải đều qua 2 instance Backend (Port 5001 & 5002)
# 2. Hỗ trợ Session Affinity (ip_hash) cho Socket.io Realtime Chat/Notifications
# 3. Tích hợp Cloudflare (Khôi phục IP thực, hỗ trợ Cloudflare SSL Full/Strict)
# 4. Giới hạn dung lượng tải lên 50MB (phù hợp tải video và nhiều ảnh)
# 5. Rate limiting chống Spam/DDoS tầng ứng dụng
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # 1. Performance & IO Optimizations
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Ẩn phiên bản Nginx vì lý do bảo mật

    # Cấu hình dung lượng tải lên tối đa (hỗ trợ upload video 30MB + ảnh)
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Timeouts chống Slowloris attack
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 20s;

    # --------------------------------------------------------------------------
    # 2. Cloudflare Real IP Restoration
    # --------------------------------------------------------------------------
    # Nhúng danh sách IP Cloudflare để biến $remote_addr thành IP thật của client
    include /etc/nginx/conf.d/cloudflare.conf;

    # --------------------------------------------------------------------------
    # 3. Structured Logging (Tương thích Cloudflare)
    # --------------------------------------------------------------------------
    log_format cloudflare_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"cf_connecting_ip":"$http_cf_connecting_ip",'
        '"cf_ray":"$http_cf_ray",'
        '"cf_ipcountry":"$http_cf_ipcountry",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/fu_market_access.log cloudflare_json;
    error_log /var/log/nginx/fu_market_error.log warn;

    # --------------------------------------------------------------------------
    # 4. Gzip Compression (Tối ưu băng thông API)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/plain
        text/css
        text/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 5. Rate Limiting Zones (Bảo vệ API và Đăng nhập)
    # --------------------------------------------------------------------------
    # Sử dụng $binary_remote_addr (sau khi đã được Cloudflare real_ip khôi phục)
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --------------------------------------------------------------------------
    # 6. Upstream Cluster (Load Balancer 2 Backend Con)
    # --------------------------------------------------------------------------
    upstream fu_market_backend_cluster {
        # Sử dụng ip_hash để đảm bảo Socket.io bắt tay (handshake/long-polling)
        # luôn định tuyến vào cùng 1 instance, tránh lỗi "Session ID unknown"
        ip_hash;

        # 2 Backend instances chạy trên VPS
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s weight=1;
        server 127.0.0.1:5002 max_fails=3 fail_timeout=10s weight=1;

        # Duy trì kết nối TCP mở sẵn để giảm latency
        keepalive 64;
    }

    # --------------------------------------------------------------------------
    # 7. HTTP Server (Port 80) -> Chuyển hướng tự động lên HTTPS
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api.fptmarket.vn market-api.yourdomain.com _;

        # Hỗ trợ xác thực Let's Encrypt Certbot nếu không dùng Cloudflare Origin Cert
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Redirect mọi traffic HTTP sang HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 8. HTTPS Server (Port 443) - Reverse Proxy & Load Balancer chính
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.fptmarket.vn market-api.yourdomain.com;

        # --- Cấu hình SSL / TLS ---
        # (Thay đường dẫn bằng Cloudflare Origin Certificate hoặc Let's Encrypt)
        ssl_certificate /etc/ssl/certs/fu_market_ssl.crt;
        ssl_certificate_key /etc/ssl/private/fu_market_ssl.key;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # --- Security Headers ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Giới hạn số kết nối đồng thời từ 1 IP
        limit_conn conn_limit 30;

        # --- Static Uploads Caching (Avatar, KYC, Ảnh sản phẩm) ---
        location /uploads/ {
            alias /var/www/fu-market/backend/uploads/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header Access-Control-Allow-Origin *;
            access_log off;
            try_files $uri @proxy_to_backend;
        }

        # --- Fallback cho static files nếu cần gọi vào backend ---
        location @proxy_to_backend {
            proxy_pass http://fu_market_backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- WebSocket Endpoint (/socket.io/) cho Realtime Chat & Thông báo ---
        location /socket.io/ {
            proxy_pass http://fu_market_backend_cluster;
            proxy_http_version 1.1;

            # Nâng cấp kết nối HTTP thành WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Header chuyển tiếp IP & Host
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cloudflare Specific Headers
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;

            # Giữ kết nối WebSocket mở liên tục (24h) không bị timeout ngắt kết nối
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }

        # --- API Đăng nhập / Xác thực (Rate limit chặt chẽ) ---
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;

            proxy_pass http://fu_market_backend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # --- Toàn bộ API nghiệp vụ (/api/products, /api/orders, ...) ---
        location / {
            limit_req zone=api_general_limit burst=60 nodelay;

            proxy_pass http://fu_market_backend_cluster;
            proxy_http_version 1.1;

            # HTTP Keep-Alive
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cloudflare Specific Headers
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;

            # Hỗ trợ tải file lớn (Multipart Form Data)
            proxy_request_buffering off;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            proxy_connect_timeout 15s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Health check endpoint cho Nginx / Cloudflare Load Balancer
        location /health {
            access_log off;
            proxy_pass http://fu_market_backend_cluster/api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
