name: Frontend CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'frontend/**'

jobs:
  test-and-build:
    name: Check & Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Check TypeScript Types
        run: npx tsc --noEmit

      - name: 🧹 Lint Code
        run: npm run lint || echo "Lint warning, continuing..."

      - name: 🏗️ Verify Next.js Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: "https://api.example.com/api"
          NEXT_PUBLIC_SOCKET_URL: "https://api.example.com"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDummyKeyForCiTest"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "marketfu-ci.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "marketfu-ci"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "marketfu-ci.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789012:web:ci_dummy_id"
