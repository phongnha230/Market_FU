name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  test-and-build:
    name: 🧪 Test & Build Backend (CI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧩 Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 Lint Code
        run: npm run lint || echo "Lint warning, continuing..."

      - name: 🧪 Run Automated Tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATABASE_URL: "mongodb://127.0.0.1:27017/campus_market_test"
          JWT_SECRET: "ci_test_jwt_secret_key_12345678901234567890123456789012"
          JWT_REFRESH_SECRET: "ci_test_jwt_refresh_secret_key_12345678901234567890123456789012"
          SHIPPING_WEBHOOK_SECRET: "ci_test_shipping_webhook_secret_min16chars"
          PAYMENT_WEBHOOK_SECRET: "ci_test_payment_webhook_secret_min16chars"
          HANDSHAKE_QR_SECRET: "ci_test_handshake_qr_secret_min16chars"

      - name: 🏗️ Verify TypeScript Build
        run: npm run build

  docker-build-and-scan:
    name: 🐳 Docker Build & Trivy Security Scan
    needs: [test-and-build]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛡️ Trivy - Scan Source Packages & Dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: fu-market-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Trivy - Scan Container Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fu-market-backend:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

  deploy-to-vps:
    name: 🚀 Auto Deploy to VPS (CD)
    needs: [test-and-build, docker-build-and-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: 🚀 SSH vào VPS & Tự động Pull Code + Rebuild Docker
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: 22
          script: |
            cd ~/app/backend
            git pull https://phongnha230:${{ env.GH_PAT }}@github.com/phongnha230/Market_FU.git main
            docker compose -f docker-compose.deploy.yml up -d --build
            docker image prune -f
