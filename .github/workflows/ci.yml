name: Backend CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  test-and-build:
    name: Test & Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧩 Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 Lint Code
        run: npm run lint || echo "Lint warning, continuing..."

      - name: 🧪 Run Automated Tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATABASE_URL: "mongodb+srv://mock:mock@cluster0.mock.mongodb.net/test?retryWrites=true&w=majority"
          JWT_SECRET: "ci_test_jwt_secret_key_123456789"
          JWT_REFRESH_SECRET: "ci_test_jwt_refresh_secret_key_123456789"
          SHIPPING_WEBHOOK_SECRET: "ci_test_shipping_webhook_secret_min16chars"
          HANDSHAKE_QR_SECRET: "ci_test_handshake_qr_secret_min16chars"

      - name: 🏗️ Verify TypeScript Build
        run: npm run build
